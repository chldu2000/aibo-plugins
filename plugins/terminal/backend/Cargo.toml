[package]
name = "aibo-terminal"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
portable-pty = "0.9.0"
serde_json = "1.0"
base64 = "0.22"
json5 = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["jobapi2", "handleapi", "winnt", "minwindef"] }
